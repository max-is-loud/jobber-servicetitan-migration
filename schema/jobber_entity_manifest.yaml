# Jobber Entity Manifest
# Machine-readable schema reference for Tightbeam v2
# Generated: 2025-11-24
# Purpose: Prevent field hallucinations and provide canonical schema reference

version: "1.0"
api_version: "2023-11-15"
graphql_endpoint: "https://api.getjobber.com/api/graphql"

# Priority 1 Entities: Core business entities
priority_1_entities:
  - client
  - property
  - request
  - quote
  - job
  - visit
  - invoice
  - expense
  - user
  - product_service
  - tax_rate
  - note
  - attachment

# Priority 2 Entities: Extended functionality
priority_2_entities:
  - timesheet_entry
  # To be added: task, reminder, schedule, event

entities:
  client:
    graphql_type: "Client"
    primary_key: "id"
    description: "Customer entities who pay for services"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
        description: "Unique identifier (EncodedId)"
      - name: "firstName"
        type: "String!"
        role: "display"
        description: "Client's first name"
      - name: "lastName"
        type: "String!"
        role: "display"
        description: "Client's last name"
      - name: "emails"
        type: "[Email!]!"
        role: "contact"
        description: "Array of email addresses"
        note: "Primary email extracted to 'email' field, rest to 'additional_emails' JSON"
      - name: "phones"
        type: "[Phone!]!"
        role: "contact"
        description: "Array of phone numbers"
        note: "Primary phone extracted to 'phone' field, rest to 'additional_phones' JSON"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
        description: "Creation timestamp"
    relationships:
      - type: "has_many"
        target: "property"
        field: "properties"
      - type: "has_many"
        target: "note"
        field: "notes"
      - type: "has_many"
        target: "request"
        field: "requests"
      - type: "has_many"
        target: "quote"
        field: "quotes"
      - type: "has_many"
        target: "job"
        field: "jobs"
      - type: "has_many"
        target: "invoice"
        field: "invoices"

  property:
    graphql_type: "Property"
    primary_key: "id"
    description: "Physical locations associated with clients"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "client"
        type: "Client"
        role: "foreign_key"
        description: "Client who owns this property"
      - name: "address"
        type: "String"
        role: "location"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "client"
        foreign_key: "client_id"
      - type: "has_many"
        target: "note"
        field: "notes"

  request:
    graphql_type: "Request"
    primary_key: "id"
    description: "Service requests from clients"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "title"
        type: "String"
        role: "display"
      - name: "description"
        type: "String"
        role: "display"
      - name: "status"
        type: "String"
        role: "state"
      - name: "priority"
        type: "String"
        role: "state"
      - name: "source"
        type: "String"
        role: "metadata"
      - name: "assignedTo"
        type: "User"
        role: "foreign_key"
      - name: "client"
        type: "Client"
        role: "foreign_key"
      - name: "property"
        type: "Property"
        role: "foreign_key"
      - name: "convertedToQuote"
        type: "Quote"
        role: "foreign_key"
        description: "Quote created from this request"
      - name: "convertedToJob"
        type: "Job"
        role: "foreign_key"
        description: "Job created from this request"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "client"
        foreign_key: "client_id"
      - type: "belongs_to"
        target: "property"
        foreign_key: "property_id"
      - type: "belongs_to"
        target: "user"
        foreign_key: "assigned_to"
      - type: "has_many"
        target: "note"
        field: "notes"

  quote:
    graphql_type: "Quote"
    primary_key: "id"
    description: "Price quotes for services"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "quoteNumber"
        type: "String"
        role: "display"
      - name: "title"
        type: "String"
        role: "display"
      - name: "quoteStatus"
        type: "String"
        role: "state"
      - name: "total"
        type: "Money"
        role: "financial"
      - name: "client"
        type: "Client"
        role: "foreign_key"
      - name: "property"
        type: "Property"
        role: "foreign_key"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "client"
        foreign_key: "client_id"
      - type: "belongs_to"
        target: "property"
        foreign_key: "property_id"
      - type: "has_many"
        target: "note"
        field: "notes"

  job:
    graphql_type: "Job"
    primary_key: "id"
    description: "Work orders for services"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "jobNumber"
        type: "String"
        role: "display"
      - name: "title"
        type: "String"
        role: "display"
      - name: "jobStatus"
        type: "String"
        role: "state"
      - name: "total"
        type: "Money"
        role: "financial"
      - name: "client"
        type: "Client"
        role: "foreign_key"
      - name: "property"
        type: "Property"
        role: "foreign_key"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "client"
        foreign_key: "client_id"
      - type: "belongs_to"
        target: "property"
        foreign_key: "property_id"
      - type: "has_many"
        target: "visit"
        field: "visits"
      - type: "has_many"
        target: "note"
        field: "notes"
      - type: "has_one"
        target: "invoice"
        field: "invoice"

  visit:
    graphql_type: "Visit"
    primary_key: "id"
    description: "Scheduled service visits"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "title"
        type: "String"
        role: "display"
      - name: "visitStatus"
        type: "String"
        role: "state"
      - name: "startAt"
        type: "ISO8601DateTime"
        role: "schedule"
      - name: "endAt"
        type: "ISO8601DateTime"
        role: "schedule"
      - name: "job"
        type: "Job"
        role: "foreign_key"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "job"
        foreign_key: "job_id"
      - type: "has_many"
        target: "note"
        field: "notes"

  invoice:
    graphql_type: "Invoice"
    primary_key: "id"
    description: "Billing invoices"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "invoiceNumber"
        type: "String"
        role: "display"
      - name: "total"
        type: "Money"
        role: "financial"
      - name: "subtotal"
        type: "Money"
        role: "financial"
      - name: "status"
        type: "String"
        role: "state"
      - name: "issuedAt"
        type: "ISO8601DateTime"
        role: "metadata"
      - name: "dueDate"
        type: "ISO8601DateTime"
        role: "schedule"
      - name: "client"
        type: "Client"
        role: "foreign_key"
      - name: "job"
        type: "Job"
        role: "foreign_key"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "client"
        foreign_key: "client_id"
      - type: "belongs_to"
        target: "job"
        foreign_key: "job_id"
      - type: "has_many"
        target: "note"
        field: "notes"

  expense:
    graphql_type: "Expense"
    primary_key: "id"
    description: "Business expenses"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "description"
        type: "String"
        role: "display"
      - name: "amount"
        type: "Money"
        role: "financial"
      - name: "expenseDate"
        type: "ISO8601DateTime"
        role: "metadata"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"

  user:
    graphql_type: "User"
    primary_key: "id"
    description: "Team members and account users"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "name"
        type: "String"
        role: "display"
      - name: "email"
        type: "String"
        role: "contact"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"

  product_service:
    graphql_type: "ProductOrService"
    primary_key: "id"
    description: "Catalog items for jobs and invoices"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "name"
        type: "String"
        role: "display"
      - name: "description"
        type: "String"
        role: "display"
      - name: "unitCost"
        type: "Money"
        role: "financial"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"

  tax_rate:
    graphql_type: "TaxRate"
    primary_key: "id"
    description: "Tax rates for invoicing"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "name"
        type: "String"
        role: "display"
      - name: "rate"
        type: "Float"
        role: "financial"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"

  note:
    graphql_type: "Note (polymorphic)"
    primary_key: "id"
    description: "Polymorphic notes attached to various entities"
    polymorphic: true
    polymorphic_types:
      - "ClientNote"
      - "JobNote"
      - "PropertyNote"
      - "QuoteNote"
      - "InvoiceNote"
      - "RequestNote"
      - "VisitNote"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "message"
        type: "String!"
        role: "display"
        description: "Note content text"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
      - name: "updatedAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    note: |
      Notes use polymorphic pattern. Each note type (ClientNote, JobNote, etc.)
      has a parent field pointing to the owning entity. In Tightbeam, we normalize
      this to entity_type (discriminator) + entity_id (foreign key).

  attachment:
    graphql_type: "NoteAttachment"
    primary_key: "id"
    description: "File attachments linked to notes"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "note"
        type: "Note"
        role: "foreign_key"
        description: "Parent note"
      - name: "fileName"
        type: "String!"
        role: "display"
      - name: "contentType"
        type: "String"
        role: "metadata"
        description: "MIME type"
      - name: "fileSize"
        type: "Int"
        role: "metadata"
        description: "Size in bytes"
      - name: "url"
        type: "String!"
        role: "metadata"
        description: "Remote download URL"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"
    relationships:
      - type: "belongs_to"
        target: "note"
        foreign_key: "note_id"
    note: |
      Tightbeam extension: local_file_path field added for download tracking.
      Files stored as ./attachments/{note_id}/{filename} locally.

  timesheet_entry:
    graphql_type: "TimesheetEntry"
    primary_key: "id"
    description: "Time tracking entries"
    fields:
      - name: "id"
        type: "ID!"
        role: "primary_key"
      - name: "description"
        type: "String"
        role: "display"
      - name: "startAt"
        type: "ISO8601DateTime"
        role: "schedule"
      - name: "endAt"
        type: "ISO8601DateTime"
        role: "schedule"
      - name: "job"
        type: "Job"
        role: "foreign_key"
      - name: "user"
        type: "User"
        role: "foreign_key"
      - name: "createdAt"
        type: "ISO8601DateTime!"
        role: "metadata"

# GraphQL Query Patterns
query_patterns:
  pagination:
    description: "Cursor-based Relay pagination"
    required_fields:
      - "first: Int"
      - "after: String"
    response_fields:
      - "edges { node { ... } }"
      - "pageInfo { hasNextPage endCursor }"

  cost_optimization:
    rule_1: "ALWAYS include 'first: N' on connections to avoid 100× cost multiplier"
    rule_2: "Limit nested queries to 10-50 items max"
    rule_3: "Avoid deeply nested queries (max 2-3 levels)"

  nested_notes:
    description: "Notes can be fetched nested or top-level"
    nested_pattern: "client { notes(first: 10) { edges { node { id message } } } }"
    top_level_pattern: "notes(first: 50) { edges { node { ... on ClientNote { client { id } } } } }"

# Validation Rules
validation_rules:
  - "All entities MUST have 'id' field"
  - "All entities MUST have 'createdAt' timestamp"
  - "Foreign keys MUST reference valid entity IDs"
  - "Polymorphic notes MUST have entity_type discriminator"
  - "Attachment URLs are temporary - download within 24 hours"
