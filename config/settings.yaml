# Tightbeam Configuration
# See example.settings.yaml for detailed documentation on all settings

rate_limits:
  conservative:
    capacity: 250
    refill_rate: 240
    initial_tokens: 40
    safety_margin: 0.52
  moderate:
    capacity: 600
    refill_rate: 600
    initial_tokens: 150
    safety_margin: 0.1
  aggressive:
    capacity: 500
    refill_rate: 480
    initial_tokens: 100
    safety_margin: 0.04
max_retries: 15
pagination:
  clients: 20
  invoices: 14
  quotes: 10
  jobs: 20
  properties: 40
  requests: 30
  users: 30
  expenses: 10
  visits: 30
  timesheet_entries: 50
  product_services: 100
  tax_rates: 30
  notes: 50
  nested_notes: 10
  default: 30
delays:
  page_delay: 1
  request_timeout: 60.0
  retry_base_delay: 2.0
  connect_timeout: 10.0
backoff:
  initial_delay: 5.0
  max_delay: 300.0
  multiplier: 2.0
  jitter_factor: 0.2
logging:
  verbose_cost_monitoring: true
  performance_logging: true
  level: DEBUG
database:
  default_path: tightbeam.sqlite
  timeout: 30.0
  wal_mode: true
attachments:
  auto_download: false
  concurrent_downloads: 30  # Number of parallel downloads (1-50, default: 3)
                            # For 1Gbps+ connections, consider 20-30
  chunk_size: 65536         # 64KB chunks for optimal throughput
  http_pool_connections: 50 # Connection pool size
  http_pool_maxsize: 50     # Max connections per pool
metrics:
  default_batch_size: 30
