# TightBeam v2 Production Environment Configuration
# Overrides for production environment settings

# Production-optimized rate limiting (more aggressive for efficiency)
rate_limits:
  conservative:
    capacity: 150
    refill_rate: 90
    safety_margin: 0.30  # Lower safety margin for production efficiency
  moderate:
    capacity: 300
    refill_rate: 180
    safety_margin: 0.20
  aggressive:
    capacity: 500
    refill_rate: 300
    safety_margin: 0.05  # Minimal safety margin for maximum throughput

# Larger pagination sizes for production efficiency
pagination:
  clients: 50
  invoices: 50
  jobs: 50
  properties: 50
  requests: 50
  users: 50
  expenses: 50
  visits: 50
  timesheet_entries: 50
  product_services: 50
  tax_rates: 50
  default: 50

# Production timing configuration
delays:
  # Minimal delays for production efficiency
  page_delay: 0.5
  request_timeout: 30.0
  retry_base_delay: 1.0

# Production backoff configuration
backoff:
  initial_delay: 0.5
  max_delay: 30.0
  multiplier: 2.0
  max_attempts: 3  # Fewer retries in production
  jitter: 0.05

# Production logging configuration
logging:
  # Minimal logging for production performance
  verbose_cost_monitoring: false
  performance_logging: false
  level: "WARNING"

# Production database configuration
database:
  default_path: "tightbeam_prod.db"
  timeout: 15.0
  wal_mode: true  # WAL mode for better production performance 