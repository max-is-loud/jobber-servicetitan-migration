# TightBeam v2 Development Environment Configuration
# Overrides for development environment settings

# Development-specific rate limiting (more conservative for testing)
rate_limits:
  conservative:
    capacity: 50
    refill_rate: 30
    safety_margin: 0.50  # Higher safety margin for development
  moderate:
    capacity: 100
    refill_rate: 60
    safety_margin: 0.40
  aggressive:
    capacity: 150
    refill_rate: 90
    safety_margin: 0.30

# Smaller pagination sizes for development/testing
pagination:
  clients: 10
  invoices: 10
  jobs: 10
  properties: 10
  requests: 10
  users: 10
  expenses: 10
  visits: 10
  timesheet_entries: 10
  product_services: 10
  tax_rates: 10
  default: 10

# Development timing configuration
delays:
  # Longer delays for development to avoid hitting API limits
  page_delay: 2.0
  request_timeout: 60.0
  retry_base_delay: 3.0

# Development logging configuration
logging:
  # Enable verbose logging in development
  verbose_cost_monitoring: true
  performance_logging: true
  level: "DEBUG"

# Development database configuration
database:
  default_path: "tightbeam_dev.db"
  timeout: 60.0
  wal_mode: false  # Simpler mode for development 